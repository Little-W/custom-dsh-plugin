# OpenCode owns the model catalog. Keep DSH's native adapters unchanged unless
# this optional provider plugin is enabled.
- id: llm-pi-ai
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-models
  disabled: true
- id: subagent
  config:
    maxDepth: 2
    maxActiveSubagents: 16
- insert:
    - id: studio-opencode
      name: '@agent-studio/plugin-opencode-provider'
      config:
        # All provider databases, model catalogs and preferences live with the
        # active DSH data home, so switching DSH_HOME moves them together.
        dataDir: !!js dshHomePath()
